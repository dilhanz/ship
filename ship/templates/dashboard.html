<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c2333;
    --muted: #5c6470;
    --border: #e2e5ea;
    --accent: #2f6fed;
    --ok: #1f9d55;
    --warn: #b7791f;
    --bad: #c53030;
    --track: #e9ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --card: #1d2129;
      --text: #e8eaee;
      --muted: #9aa2ad;
      --border: #2c313b;
      --accent: #6c9bff;
      --ok: #4cc38a;
      --warn: #e0a458;
      --bad: #f07171;
      --track: #2c313b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 8px; }
  header h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
  .updated { color: var(--muted); font-size: 0.85rem; margin: 4px 0 0; }
  section { margin-top: 28px; }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card + .card { margin-top: 12px; }
  .next {
    border-left: 4px solid var(--accent);
  }
  .next .item-name { font-size: 1.1rem; font-weight: 600; }
  .next .item-meta { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .milestone-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .milestone-head h3 { margin: 0; font-size: 1.05rem; }
  .goal { color: var(--muted); font-size: 0.9rem; margin: 4px 0 10px; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.active { color: var(--accent); border-color: var(--accent); }
  .badge.done { color: var(--ok); border-color: var(--ok); }
  .badge.blocked { color: var(--bad); border-color: var(--bad); }
  .badge.in-progress { color: var(--warn); border-color: var(--warn); }
  .progress {
    background: var(--track);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin: 6px 0 12px;
  }
  .progress-fill {
    background: var(--ok);
    height: 100%;
    border-radius: 999px;
  }
  .progress-label { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: none; }
  .status-done { color: var(--ok); }
  .status-blocked { color: var(--bad); }
  .status-in-progress { color: var(--warn); }
  .status-pending { color: var(--muted); }
  .source { color: var(--muted); font-size: 0.8rem; }
  .size { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .blocker-reason {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 2px 0 0;
    padding-left: 14px;
    border-left: 2px solid var(--border);
  }
  .decision { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .decision:last-child { border-bottom: none; }
  .decision .date { color: var(--muted); font-size: 0.8rem; }
  .decision .title { font-weight: 600; }
  .decision p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  .empty { color: var(--muted); font-style: italic; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.78rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>
<!-- PM:PROJECT -->
    </h1>
    <p class="updated">
<!-- PM:UPDATED -->
    </p>
  </header>

  <section>
    <h2>&#9654; Work on next</h2>
    <div class="card next">
<!-- PM:NEXT -->
    </div>
  </section>

  <section>
    <h2>&#9203; In flight</h2>
    <div class="card">
<!-- PM:INFLIGHT -->
    </div>
  </section>

  <section>
    <h2>&#8646; Lanes</h2>
    <div class="card">
<!-- PM:LANES -->
    </div>
  </section>

  <section>
    <h2>&#9873; Milestones</h2>
<!-- PM:MILESTONES -->
  </section>

  <section>
    <h2>&#9888; Blockers</h2>
    <div class="card">
<!-- PM:BLOCKERS -->
    </div>
  </section>

  <section>
    <h2>&#9998; Recent decisions</h2>
    <div class="card">
<!-- PM:DECISIONS -->
    </div>
  </section>

  <footer>Generated by Ship &middot; /ship:pm-sync to refresh</footer>
</main>
</body>
</html>
